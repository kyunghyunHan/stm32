[package]
name = "stm32"
version = "0.1.0"
edition = "2024"
autobins = false
default-run = "stm32"

[[bin]]
name = "stm32"
path = "src/firmware.rs"
test = false
bench = false

[[bin]]
name = "led_button"
path = "src/f446re/rust/gpio_button_led_level.rs"
required-features = ["f446"]
test = false
bench = false

[[bin]]
name = "uart_led"
path = "src/f446re/rust/uart_rx_led_control.rs"
required-features = ["f446"]
test = false
bench = false

[[bin]]
name = "uart"
path = "src/f446re/rust/uart_echo_greeting.rs"
required-features = ["f446"]
test = false
bench = false

# Python 없이 active-f446 출력 이름을 유지합니다.
# 실행할 F446 Rust 소스를 바꾸려면 아래 path를 수정하세요.
[[bin]]
name = "active-f446"
path = "src/f446re/rust/uart_rx_led_control.rs"
required-features = ["f446"]
test = false
bench = false

[features]
default = ["f446"]
f446 = ["dep:stm32f4"]
f767 = ["dep:stm32f7"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4 = { version = "0.16.0", features = ["stm32f446"], optional = true }
stm32f7 = { version = "0.16.0", features = ["stm32f767"], optional = true }
